{% extends "base.html" %}

{% block title %}Password reset complete - ProofBill{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 40px auto;">
    <div class="surface">
        <h2 style="margin-top: 0; font-size: 20px;">Password reset complete</h2>
        <p style="color: var(--text-secondary); margin-bottom: 24px;">Your password has been updated successfully. You can now sign in with your new credentials.</p>

        <a href="{% url 'login' %}" class="btn btn-primary" style="width: 100%; text-align: center;">Sign in</a>
    </div>
</div>
{% endblock %}
